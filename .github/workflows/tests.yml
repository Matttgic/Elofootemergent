name: Tests

# Vérifie chaque PR (et chaque push sur main) : tests backend hors ligne, build
# de production du frontend et parcours dans un navigateur (Playwright) sur une
# API simulée. Aucun secret n'est utilisé : les tests d'intégration (backend
# déployé) sont ignorés sans REACT_APP_BACKEND_URL.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Erreurs Python (imports inutilisés, noms indéfinis…)
        run: flake8 --select=F --exclude=__pycache__ .
      - name: Tests
        run: pytest

  frontend:
    name: Frontend (build de production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"   # même version que le projet Vercel
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Build (avertissements ESLint = erreurs, comme sur Vercel)
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: https://footpulse-api.onrender.com
        run: yarn build

  e2e:
    name: Navigateur (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Build du site pointant vers l'API simulée
        working-directory: frontend
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: http://127.0.0.1:8765
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Captures des échecs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-echecs
          path: e2e/test-results/
          retention-days: 7
